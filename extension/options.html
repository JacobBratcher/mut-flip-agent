<!doctype html>
<html><head><meta charset="utf-8"><title>MUT Flip Feeder settings</title><style>
  body { font-family: Poppins, system-ui, sans-serif; background: #262624; color: #e8e6dc; max-width: 520px; margin: 40px auto; padding: 0 16px; }
  h1 { color: #fff; font-size: 20px; } label { display: block; margin: 16px 0 6px; font-size: 13px; color: #b8b5ad; }
  input { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 10px; border: 1px solid #444; background: #30302e; color: #fff; }
  button { margin-top: 18px; padding: 10px 18px; border: 0; border-radius: 10px; background: #d97757; color: #fff; font-weight: 600; cursor: pointer; }
  #msg { margin-top: 12px; font-size: 13px; }
</style></head><body>
  <h1>MUT Flip Feeder</h1>
  <label for="url">Agent URL (your Home Assistant IP, port 8099)</label>
  <input id="url" placeholder="http://192.168.1.50:8099">
  <label for="token">Feeder token (same as the add-on's feeder_token)</label>
  <input id="token" type="password">
  <button id="save">Save &amp; test</button>
  <div id="msg"></div>
  <script src="options.js"></script>
</body></html>
