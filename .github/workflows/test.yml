name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mut-flip-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test ../extension/tests/*.test.cjs
  windows-installer-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse installer with Windows PowerShell
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($file in @('extension/install.ps1', 'extension/agent-relay.ps1')) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { $parseErrors | Format-List; exit 1 }
          }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test loopback agent relay on Windows
        run: python -m unittest discover -s extension/tests -p 'test_*.py' -v
