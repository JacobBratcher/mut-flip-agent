# Standalone Docker config. Secrets go in .env, not here.
platform: pc
game: "27"
fetch_mode: extension            # extension (Chrome feeder) or direct (plain HTTP)
feeder_token: change-me          # shared secret with the Chrome extension
api_token_header: Authorization   # change if mut.gg told you a different header
requests_per_minute: 20           # keep within what mut.gg approved
watchlist:
  # Paste mut.gg player URLs. These get checked every few minutes.
  - https://www.mut.gg/players/12562-tj-watt/27-162004004/
discover_all_players: true
min_ovr: 85                       # only track cards at this overall or higher (0 = all)
flip:
  min_profit: 10000
  min_roi: 0.08
  min_discount: 0.12
  lookback_hours: 168              # how far back to look for the latest sales
  min_sales: 3                     # sales needed in that window before a card is priced
  alert_cooldown_hours: 6
  sale_alerts: false                # also alert on cheap sales (already bought, so not snipeable)
  max_buy_budget: 0               # 0 = no cap
invest:
  enabled: false                    # long-term investment digest
  digest_hour: 9
  window_days: 30
  min_days_history: 5
  min_drawdown: 0.25
  min_daily_sales: 3
  recovery_target: 0.5
  top_n: 10
tiers:
  watch_minutes: 2
  hot_minutes: 10
  cold_hours: 24
  hot_min_value: 25000
  hot_min_daily_sales: 5
  fresh_minutes: 3        # new releases are checked this often...
  fresh_hours: 48         # ...for this long after they come out
  fresh_long_hours: 168   # LTD / Champions cards stay in the fast lane for a week
tax_rate: 0.10
