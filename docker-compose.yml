# Standalone option (any Docker host, e.g. a Proxmox LXC).
# Home Assistant OS users: install as an add-on instead (see README).
services:
  mut-flip-agent:
    build: ./mut-flip-agent
    container_name: mut-flip-agent
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/New_York
      CONFIG_PATH: /config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
