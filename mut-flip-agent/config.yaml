name: MUT Flip Agent
version: "1.3.1"
slug: mut_flip_agent
description: Watches mut.gg PC prices and sends Discord alerts for flips and long-term investments.
url: https://github.com/JacobBratcher/mut-flip-agent
arch:
  - amd64
  - aarch64
init: false
startup: application
hassio_api: true
services:
  - mqtt:want
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Feeder API for the Chrome extension
boot: auto
options:
  discord_webhook_url: ""
  platform: pc
  game: "27"
  fetch_mode: extension
  feeder_token: ""
  api_token: ""
  api_token_header: Authorization
  requests_per_minute: 20
  watchlist: []
  discover_all_players: true
  min_ovr: 83
  flip:
    min_profit: 10000
    min_roi: 0.08
    min_discount: 0.12
    lookback_hours: 48
    min_sales: 8
    alert_cooldown_hours: 6
    max_buy_budget: 0
  invest:
    enabled: true
    digest_hour: 9
    window_days: 30
    min_days_history: 5
    min_drawdown: 0.25
    min_daily_sales: 3
    recovery_target: 0.5
    top_n: 10
  tiers:
    watch_minutes: 2
    hot_minutes: 10
    cold_hours: 24
    hot_min_value: 25000
    hot_min_daily_sales: 5
  tax_rate: 0.10
schema:
  discord_webhook_url: url
  platform: list(pc)
  game: str
  fetch_mode: list(extension|direct)
  feeder_token: password?
  api_token: password?
  api_token_header: str
  requests_per_minute: int(1,120)
  watchlist:
    - str
  discover_all_players: bool
  min_ovr: int(0,99)
  flip:
    min_profit: int(0,)
    min_roi: float(0,)
    min_discount: float(0,1)
    lookback_hours: int(6,720)
    min_sales: int(3,)
    alert_cooldown_hours: int(0,)
    max_buy_budget: int(0,)
  invest:
    enabled: bool
    digest_hour: int(0,23)
    window_days: int(7,120)
    min_days_history: int(3,)
    min_drawdown: float(0,1)
    min_daily_sales: float(0,)
    recovery_target: float(0,1)
    top_n: int(1,25)
  tiers:
    watch_minutes: int(1,)
    hot_minutes: int(1,)
    cold_hours: int(1,)
    hot_min_value: int(0,)
    hot_min_daily_sales: float(0,)
  tax_rate: float(0,0.5)
